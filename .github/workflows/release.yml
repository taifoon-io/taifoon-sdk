name: Release (npm publish)

# Triggered by pushing a version tag: v0.1.0, v0.2.0-beta.1, etc.
# Builds, tests, then publishes @taifoon/sdk to the npm registry.
#
# Required repo secret:
#   NPM_TOKEN — a Granular Access Token with "Publish" permission on @taifoon/sdk.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install deps
        run: npm ci

      - name: Lint + typecheck
        run: npm run lint && npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
